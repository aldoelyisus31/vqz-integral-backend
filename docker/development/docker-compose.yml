version: '3.8'

services:
  app:
    build:
      context: ../../
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
      - "9229:9229"  # Debug port
    environment:
      - NODE_ENV=development
    volumes:
      - ../../:/app
      - /app/node_modules
    command: npm run start:dev  # Use development mode with hot-reload
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped