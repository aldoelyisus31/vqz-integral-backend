version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: test_postgres
    restart: always
    environment:
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    networks:
      - nest_network

volumes:
  postgres_data_test:

networks:
  nest_network:
